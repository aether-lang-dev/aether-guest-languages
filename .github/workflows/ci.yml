        run: GUEST_LANG=tcl sh tests/run.sh

  # Perl: the runtime library only (libperl5.38t64 on Ubuntu 24.04, which the
  # perl package depends on); no libperl-dev, which the bridge does not need
  # to build. tests/perl_env.sh asks PERL for its library.
  linux-perl:
    name: Linux (in-process, Perl 5.38)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Perl
        run: sudo apt-get update && sudo apt-get install -y perl libperl5.38t64
      - name: ae (AE_PIN)
