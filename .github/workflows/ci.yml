        run: GUEST_LANG=perl PERL=/usr/bin/perl sh tests/run.sh

  # Ruby: the runtime library only (libruby3.2 on Ubuntu 24.04, and the ruby
  # binary tests/ruby_env.sh asks for RbConfig); no ruby-dev, which the bridge
  # does not need to build.
  linux-ruby:
    name: Linux (in-process, Ruby 3.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ruby
        run: sudo apt-get update && sudo apt-get install -y ruby libruby3.2
      - name: ae (AE_PIN)
