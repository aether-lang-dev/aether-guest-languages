  # Java: a JDK 21 or later and nothing else. The bridge starts a JVM rather
  # than loading libjvm, so there is no runtime package to find; build.sh
  # compiles with javac and jar (JDK 21 has the Foreign Function API as a
  # preview, which java/build.sh and tests/java_env.sh turn on). The libc rows
  # of the table need no gcc; the recording preload of test_ways.sh does, and the
  # runner has it. On Linux the contained-child jobs pass with the child
  # BLOCKED: a JVM does not start under the preload (java/README.md, "The wall
  # that stops a JVM"), which the tests check rather than skip.
  linux-java:
    name: Linux (in-process, OpenJDK 21)
    runs-on: ubuntu-24.04
    steps:
