  # QuickJS: nothing to install. The engine is aether's contrib.quickjs, which
  # every ae release ships with its pinned amalgamation, compiled into the
  # program, so the jobs need only ae.
  linux-quickjs:
    name: Linux (in-process, quickjs-ng 0.17.0)
