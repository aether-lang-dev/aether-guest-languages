    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: ae (AE_PIN)
        run: |
          . ci/versions.env
          curl -fsSL "https://raw.githubusercontent.com/aether-lang-dev/aeb/$AEB_REF/get.sh" \
            | AE_PIN="$AE_PIN" AEB_REF="$AEB_REF" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ae version
