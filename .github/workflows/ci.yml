      - run: ae version
      - name: Homebrew's python@3.13
        run: GUEST_LANG=python PYTHON="$(brew --prefix python@3.13)/bin/python3.13" sh tests/run.sh

  # Duktape: the runtime library only (libduktape207 on Ubuntu 24.04, Duktape
  # 2.7); no libduktape-dev, which the bridge does not need to build.
  # tests/duktape_env.sh finds the library in the loader's cache.
  linux-duktape:
    name: Linux (in-process, Duktape 2.7)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Duktape
        run: sudo apt-get update && sudo apt-get install -y libduktape207
