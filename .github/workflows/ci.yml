        run: GUEST_LANG=ruby RUBY="$(brew --prefix ruby)/bin/ruby" sh tests/run.sh

  # Go: the toolchain only, to build the c-shared libraries the tests load
  # (golang-go on Ubuntu 24.04, which brings gcc along for cgo; the macOS runner
  # has Go and clang). The bridge needs no Go to build or run, only the
  # library does. TinyGo is not used: its c-shared is wasm-only (tinygo/README.md).
  linux-tinygo:
    name: Linux (in-process, Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Go (cgo needs a C compiler, which the runner has)
        run: sudo apt-get update && sudo apt-get install -y golang-go && go version
      - name: ae (AE_PIN)
        run: |
          . ci/versions.env
          curl -fsSL "https://raw.githubusercontent.com/aether-lang-dev/aeb/$AEB_REF/get.sh" \
